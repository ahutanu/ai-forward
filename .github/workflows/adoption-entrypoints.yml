name: adoption-entrypoints
on:
  push:
    branches: [feat/one-command-adoption]
  pull_request:
    paths:
      - bootstrap.py
      - pack/commands/deliver/**
      - pack/scripts/delivery.py
      - pack/scripts/pack-apply.py
      - pack/adapters/hooks/run-hook.sh
      - README.md
      - web/handbook/guides/get-started.md
      - tests/docs_explorer/test_uv_hook_launcher.py
      - tests/docs_explorer/test_bootstrap.py
      - tests/docs_explorer/test_delivery.py
      - tests/docs_explorer/test_adoption_entrypoints.py
      - .github/workflows/adoption-entrypoints.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable-adoption:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install isolated test tools
        run: python -m pip install pytest uv==0.10.0
      - name: Routing, resume, preservation and real deployment tests
        run: python -m pytest tests/docs_explorer/test_delivery.py tests/docs_explorer/test_bootstrap.py tests/docs_explorer/test_adoption_entrypoints.py tests/docs_explorer/test_uv_hook_launcher.py -q
      - name: Actual remote one-liner and repeat install in a plain project
        # Only GitHub's repository name and generated commit SHA are interpolated;
        # never PR titles, messages, branch names or dispatch-provided shell input.
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'AI Forward project'
          New-Item -ItemType Directory -Path $target | Out-Null
          Push-Location $target
          $url = 'https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/bootstrap.py'
          uv run --no-config --no-project --script $url --repo https://github.com/${{ github.repository }}.git --ref ${{ github.sha }}
          if ($LASTEXITCODE -ne 0) { throw 'Remote bootstrap failed' }
          if (!(Test-Path '.agents/skills/deliver/SKILL.md')) { throw 'Codex/Antigravity entrypoint missing' }
          if (!(Test-Path '.github/prompts/deliver.prompt.md')) { throw 'Copilot entrypoint missing' }
          if (Test-Path '.git') { throw 'Bootstrap initialized Git without consent' }
          uv run --no-config --no-project --script $url --repo https://github.com/${{ github.repository }}.git --ref ${{ github.sha }}
          if ($LASTEXITCODE -ne 0) { throw 'Repeat bootstrap failed' }
          Pop-Location
      - name: Exact one-liner under Windows cmd
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          mkdir "%RUNNER_TEMP%\AI Forward cmd"
          cd /d "%RUNNER_TEMP%\AI Forward cmd"
          uv run --no-config --no-project --script https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/bootstrap.py --repo https://github.com/${{ github.repository }}.git --ref ${{ github.sha }}
          if errorlevel 1 exit /b 1
          if not exist .agents\skills\deliver\SKILL.md exit /b 1
